# CI (0.16): typecheck, unit test, audit dependensi, build, pemeriksaan bundle klien, e2e Playwright, anggaran
# Lighthouse mobile. Tanpa rahasia asli: build memakai NILAI SENTINEL untuk memastikan rahasia server tidak masuk
# bundle klien; e2e & Lighthouse berjalan di Demo Mode (env kosong saat runtime).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit dependensi (gagal pada high ke atas)
        run: npm audit --audit-level=high
      - name: Build dengan nilai sentinel rahasia
        run: npm run build
        env:
          INTERVALS_API_KEY: sentinel-intervals-key-ci-0000
          APP_PASSCODE: sentinel-sandi-ci-0000
          SESSION_SECRET: sentinel-session-secret-ci-000000000000000000
          UPSTASH_REDIS_REST_TOKEN: sentinel-upstash-token-ci-0000
          KV_REST_API_TOKEN: sentinel-kv-token-ci-0000
      - name: Rahasia tidak ada di bundle klien
        run: npm run check:bundle
        env:
          INTERVALS_API_KEY: sentinel-intervals-key-ci-0000
          APP_PASSCODE: sentinel-sandi-ci-0000
          SESSION_SECRET: sentinel-session-secret-ci-000000000000000000
          UPSTASH_REDIS_REST_TOKEN: sentinel-upstash-token-ci-0000
          KV_REST_API_TOKEN: sentinel-kv-token-ci-0000
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (Demo Mode, mobile gelap + desktop terang + sandi uji)
        run: npm run e2e
      - name: Anggaran Lighthouse mobile
        run: |
          npx next start -p 3400 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3400/offline && break; sleep 1; done
          npm run lighthouse -- http://localhost:3400
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Laporan Playwright saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
